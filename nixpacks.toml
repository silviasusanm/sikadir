[providers]
providers = ['php']

[phases.setup]
nixPkgs = ['php83', 'composer']

[phases.build]
cmds = ['composer install --no-dev --optimize-autoloader']

[start]
cmd = 'php artisan storage:link --force && php artisan view:clear && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT'